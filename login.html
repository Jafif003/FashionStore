


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion system | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a class="brand" href="home.html">
            <img src="logo.png" alt="Fashion Design Logo">
            <span>Fashion system</span>
        </a>
<nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="login.html" class="active">Login</a></li>
            <li><a href="Signup.html">Sign Up</a></li>
            <li><a href="AboutUs.html">About Us</a></li>
        </ul>
    </nav>
</header>

<main class="form-page reveal">
    <form id="login-form" class="pretty-form glass-card">
        <p class="eyebrow">Customer Area</p>
        <h1>Login</h1>

        <label for="login-email">Email Address</label>
        <input 
            type="email" 
            id="login-email" 
            placeholder="Enter your email" 
            required
        >

        <label for="login-password">Password</label>
        <input 
            type="password" 
            id="login-password" 
            placeholder="Enter your password" 
            required 
            minlength="8"
        >

        <button type="submit" class="primary-btn full-btn">Login</button>
        <button type="button" id="logout-btn" class="secondary-btn full-btn">Logout</button>

        <p class="switch-form-text" style="margin-top: 15px; text-align: center;">
            Don't have an account? <a href="Signup.html">Sign up here</a>
        </p>

        <p id="login-message" class="status-message"></p>
    </form>
</main>

<footer>
    <p>&copy; 2026 Fashion Design. All rights reserved.</p>
</footer>

<script src="script.js"></script>
