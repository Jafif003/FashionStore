
<link rel="stylesheet" href="css/style.css">
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FashionStore - Collection</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header & Navigation Bar -->
    <header>
        <nav class="navbar">
            <h2 class="logo">Elegance Store</h2>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="collection.html" class="active">Collections</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <!-- Collection Section -->
    <main class="products-page">
        <h2 class="page-title">New Exclusive Collection</h2>
        <div class="products-grid">
            
            <!-- Product Item 1 -->
            <div class="product-card">
                <div class="image-container">
                    <!-- z-index requirement badge -->
                    <span class="badge">Exclusive</span>
                    <img src="https://via.placeholder.com/250x300/4c1d95/faf5ff?text=Evening+Dress" alt="Evening Dress">
                </div>
                <h3>Purple Evening Dress</h3>
                <p class="price">350 SAR</p>
                <button class="wishlist-btn">Add to Wishlist ❤️</button>
            </div>

            <!-- Product Item 2 -->
            <div class="product-card">
                <div class="image-container">
                    <span class="badge">Coming Soon</span>
                    <img src="https://via.placeholder.com/250x300/4c1d95/faf5ff?text=Silk+Blouse" alt="Silk Blouse">
                </div>
                <h3>Elegant Silk Blouse</h3>
                <p class="price">120 SAR</p>
                <button class="wishlist-btn">Add to Wishlist ❤️</button>
            </div>

        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
